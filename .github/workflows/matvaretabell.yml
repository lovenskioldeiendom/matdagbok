# Henter en fersk kopi av Matvaretabellen (foods.min.json) hver måned.
# Brukes som reserve hvis appen ikke får hentet tabellen direkte fra matvaretabellen.no.
name: Oppdater matvaretabell
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/hent-matvaretabell.mjs]
  schedule:
    - cron: '0 4 2 * *'
permissions:
  contents: write
jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/hent-matvaretabell.mjs
      - name: Lagre hvis endret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foods.min.json
          git diff --cached --quiet || (git commit -m "Oppdater matvaretabell" && git push)
